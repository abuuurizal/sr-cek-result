name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || 22 }}
          script: |
            # Berhenti jika ada perintah yang gagal (agar error tidak tersembunyi)
            set -e

            # Tentukan direktori target project di VPS
            TARGET_DIR="${{ secrets.PROD_DEPLOY_PATH || '/www/wwwroot/demo-cek-result.solusina.id' }}"

            echo "🚀 Menuju ke direktori: $TARGET_DIR"
            cd "$TARGET_DIR"

            # Izinkan Git membaca repository meskipun owner-nya www
            git config --global --add safe.directory "$TARGET_DIR"

            echo "📥 Mengambil perubahan terbaru dari branch main..."
            git checkout main
            git pull origin main

            echo "📌 Commit aktif di server:"
            git log -1 --oneline

            # Izinkan Composer berjalan sebagai root/super user jika diperlukan
            export COMPOSER_ALLOW_SUPERUSER=1

            echo "📦 Menginstall dependensi Composer (Production)..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🗄️ Menjalankan migrasi database..."
            php artisan migrate --force

            echo "🔗 Memastikan symbolic link storage terhubung..."
            php artisan storage:link || true

            echo "📦 Memastikan assets Livewire terpasang..."
            php artisan livewire:publish --assets || true

            echo "⚡ Mengoptimalkan cache Laravel..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔒 Mengatur hak akses kepemilikan file untuk Nginx (www:www)..."
            chown -R www:www "$TARGET_DIR"
            chmod -R 775 "$TARGET_DIR/storage" "$TARGET_DIR/bootstrap/cache"

            echo "✅ Deployment ke Production berhasil diselesaikan!"
