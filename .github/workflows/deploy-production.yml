name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SERVER_IP || '103.178.175.46' }}
          username: ${{ secrets.PROD_SERVER_USERNAME || 'root' }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT || 22 }}
          script: |
            set -e

            TARGET_DIR="${{ secrets.PROD_DEPLOY_PATH || '/www/wwwroot/demo-cek-result.solusina.id' }}"

            echo "🚀 Menuju ke direktori: $TARGET_DIR"
            cd "$TARGET_DIR"

            git config --global --add safe.directory "$TARGET_DIR"

            echo "📥 Mengambil perubahan terbaru dari branch main..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e .env -e storage

            echo "🔑 Memastikan konfigurasi SYNC_API_KEY di .env VPS..."
            if [ -f .env ] && ! grep -q "SYNC_API_KEY" .env; then
                echo "" >> .env
                echo "SYNC_API_KEY=sr-sync-secret-key-2026" >> .env
            fi

            export COMPOSER_ALLOW_SUPERUSER=1

            echo "📦 Menginstall dependensi Composer (Production)..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🗄️ Menjalankan migrasi database..."
            php artisan migrate --force

            echo "⚡ Mengoptimalkan cache Laravel..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔒 Mengatur hak akses kepemilikan file..."
            chown -R www:www "$TARGET_DIR" || true
            chmod -R 775 storage bootstrap/cache || true

            echo "✅ Deployment cek-result-vps selesai dengan sukses!"
